apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: track-availability-database
  namespace: lineclear
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: track-availability-database
  dataFrom:
    - extract:
        key: lineclear/track-availability/database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: track-availability-rds-master
  namespace: lineclear
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: track-availability-rds-master
  dataFrom:
    - extract:
        key: lineclear/rds/master