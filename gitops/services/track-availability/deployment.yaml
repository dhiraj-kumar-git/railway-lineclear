apiVersion: apps/v1
kind: Deployment
metadata:
  name: track-availability
  namespace: lineclear
  labels:
    app.kubernetes.io/name: track-availability
    app.kubernetes.io/part-of: railway-lineclear
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: track-availability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: track-availability
        app.kubernetes.io/part-of: railway-lineclear
    spec:
      containers:
        - name: track-availability
          image: 714989832567.dkr.ecr.ap-south-1.amazonaws.com/lineclear/track-availability:02218b9
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9100
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: track-availability-database, key: host }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: track-availability-database, key: port }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: track-availability-database, key: dbname }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: track-availability-database, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: track-availability-database, key: password }
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10