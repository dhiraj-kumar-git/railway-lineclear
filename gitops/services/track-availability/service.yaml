apiVersion: v1
kind: Service
metadata:
  name: track-availability
  namespace: lineclear
  labels:
    app.kubernetes.io/name: track-availability
spec:
  selector:
    app.kubernetes.io/name: track-availability
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
    - name: metrics
      port: 9100
      targetPort: metrics