apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-registry
  namespace: lineclear
  labels:
    app.kubernetes.io/name: train-registry
    app.kubernetes.io/part-of: railway-lineclear
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: train-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: train-registry
        app.kubernetes.io/part-of: railway-lineclear
    spec:
      containers:
        - name: train-registry
          image: 714989832567.dkr.ecr.ap-south-1.amazonaws.com/lineclear/train-registry:63e913d
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: train-registry-database, key: host }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: train-registry-database, key: port }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: train-registry-database, key: dbname }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: train-registry-database, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: train-registry-database, key: password }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10