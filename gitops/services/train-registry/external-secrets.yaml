# Copies the service's own database login from Secrets Manager
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: train-registry-database
  namespace: lineclear
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: train-registry-database
  dataFrom:
    - extract:
        key: lineclear/train-registry/database
---
# Copies the RDS master login, used only by the database setup Job
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-master
  namespace: lineclear
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: rds-master
  dataFrom:
    - extract:
        key: lineclear/rds/master