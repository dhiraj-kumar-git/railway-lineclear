apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: train-registry
  namespace: lineclear
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: train-registry
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60