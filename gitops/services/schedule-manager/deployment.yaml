apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule-manager
  namespace: lineclear
  labels:
    app.kubernetes.io/name: schedule-manager
    app.kubernetes.io/part-of: railway-lineclear
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: schedule-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schedule-manager
        app.kubernetes.io/part-of: railway-lineclear
    spec:
      containers:
        - name: schedule-manager
          image: 714989832567.dkr.ecr.ap-south-1.amazonaws.com/lineclear/schedule-manager:20151db
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 50051
          env:
            - name: CANDIDATE_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: ELECTION
              value: schedule-coordinator
            - name: LEADER_ELECTION_TARGET
              value: leader-election.lineclear.svc.cluster.local:50051
            - name: TRACK_AVAILABILITY_TARGET
              value: track-availability.lineclear.svc.cluster.local:50051
            - name: INCIDENT_MANAGER_TARGET
              value: incident-manager.lineclear.svc.cluster.local:50051
            - name: TRAIN_REGISTRY_URL
              value: http://train-registry.lineclear.svc.cluster.local
            - name: DIVERSION_DELAY_MINUTES
              value: "25"
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: schedule-manager-database, key: host }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: schedule-manager-database, key: port }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: schedule-manager-database, key: dbname }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: schedule-manager-database, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: schedule-manager-database, key: password }
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef: { name: kafka-connection, key: bootstrap_servers }
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                secretKeyRef: { name: kafka-connection, key: security_protocol }
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10