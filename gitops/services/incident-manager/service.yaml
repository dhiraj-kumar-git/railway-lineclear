apiVersion: v1
kind: Service
metadata:
  name: incident-manager
  namespace: lineclear
  labels:
    app.kubernetes.io/name: incident-manager
spec:
  selector:
    app.kubernetes.io/name: incident-manager
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: kubernetes.io/h2c