apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-manager
  namespace: lineclear
  labels:
    app.kubernetes.io/name: incident-manager
    app.kubernetes.io/part-of: railway-lineclear
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-manager
        app.kubernetes.io/part-of: railway-lineclear
    spec:
      containers:
        - name: incident-manager
          image: 714989832567.dkr.ecr.ap-south-1.amazonaws.com/lineclear/incident-manager:dcbd5ee
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 50051
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: incident-manager-database, key: host }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: incident-manager-database, key: port }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: incident-manager-database, key: dbname }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: incident-manager-database, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: incident-manager-database, key: password }
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef: { name: kafka-connection, key: bootstrap_servers }
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                secretKeyRef: { name: kafka-connection, key: security_protocol }
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10