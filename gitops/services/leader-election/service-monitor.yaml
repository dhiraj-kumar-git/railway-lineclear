apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: leader-election
  namespace: lineclear
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: leader-election
  endpoints:
    - port: metrics
      path: /metrics
      interval: 5s # often enough for the no-leader alert, which waits 10 s