apiVersion: v1
kind: Service
metadata:
  name: leader-election
  namespace: lineclear
  labels:
    app.kubernetes.io/name: leader-election
spec:
  selector:
    app.kubernetes.io/name: leader-election
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
    - name: metrics
      port: 9100
      targetPort: metrics