apiVersion: apps/v1
kind: Deployment
metadata:
  name: leader-election
  namespace: lineclear
  labels:
    app.kubernetes.io/name: leader-election
    app.kubernetes.io/part-of: railway-lineclear
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: leader-election
  template:
    metadata:
      labels:
        app.kubernetes.io/name: leader-election
        app.kubernetes.io/part-of: railway-lineclear
    spec:
      serviceAccountName: leader-election
      containers:
        - name: leader-election
          image: 714989832567.dkr.ecr.ap-south-1.amazonaws.com/lineclear/leader-election:9ad129a
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9100
          env:
            - name: LEASE_TABLE
              value: lineclear-election-lease
            - name: AWS_REGION
              value: ap-south-1
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef: { name: kafka-connection, key: bootstrap_servers }
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                secretKeyRef: { name: kafka-connection, key: security_protocol }
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10