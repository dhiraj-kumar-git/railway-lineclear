# Inside the cluster only: Prometheus reads /metrics through it
apiVersion: v1
kind: Service
metadata:
  name: ops-analytics
  namespace: lineclear
  labels:
    app.kubernetes.io/name: ops-analytics
spec:
  selector:
    app.kubernetes.io/name: ops-analytics
  ports:
    - name: http
      port: 80
      targetPort: http
