# Nodes, pods and the two autoscalers
# Grafana's sidecar loads every ConfigMap labelled grafana_dashboard: "1".
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-health-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-health.json: |
    {
      "uid": "lineclear-cluster-health",
      "title": "Railway LineClear: cluster health",
      "description": "Nodes, pods and autoscaling",
      "tags": ["railway-lineclear"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "type": "row",
          "title": "Nodes",
          "collapsed": false,
          "panels": [],
          "id": 1,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}
        },
        {
          "type": "stat",
          "title": "Nodes ready",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "legendFormat": "",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "textMode": "value"},
          "id": 2,
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 1}
        },
        {
          "type": "stat",
          "title": "Pods not ready in lineclear",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_ready{namespace=\"lineclear\",condition=\"false\"}) or vector(0)",
              "legendFormat": "",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "textMode": "value"},
          "id": 3,
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 1}
        },
        {
          "type": "stat",
          "title": "Pod restarts in lineclear, last hour",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"lineclear\"}[1h])) or vector(0)",
              "legendFormat": "",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "textMode": "value"},
          "id": 4,
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 1}
        },
        {
          "type": "stat",
          "title": "Pods running, all namespaces",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
              "legendFormat": "",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "textMode": "value"},
          "id": 5,
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 1}
        },
        {
          "type": "timeseries",
          "title": "CPU used by node",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))",
              "legendFormat": "{{instance}}",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percentunit", "custom": {"drawStyle": "line", "fillOpacity": 10, "showPoints": "never"}},
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "id": 6,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5}
        },
        {
          "type": "timeseries",
          "title": "Memory used by node",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes",
              "legendFormat": "{{instance}}",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percentunit", "custom": {"drawStyle": "line", "fillOpacity": 10, "showPoints": "never"}},
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "id": 7,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5}
        },
        {
          "type": "row",
          "title": "Autoscaling",
          "collapsed": false,
          "panels": [],
          "id": 8,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 13}
        },
        {
          "type": "timeseries",
          "title": "Replicas of the autoscaled services",
          "description": "What each HPA has and wants. They scale between 2 and 8.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"lineclear\"}",
              "legendFormat": "{{horizontalpodautoscaler}} running",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"lineclear\"}",
              "legendFormat": "{{horizontalpodautoscaler}} wanted",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "showPoints": "never"}},
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "id": 9,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14}
        },
        {
          "type": "timeseries",
          "title": "CPU used, share of the request, autoscaled services",
          "description": "Roughly what the HPA sees. It adds pods above the 60% line.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"lineclear\",container=~\"train-registry|position-ingestion\"}[1m])) / sum by (container) (kube_pod_container_resource_requests{namespace=\"lineclear\",resource=\"cpu\",container=~\"train-registry|position-ingestion\"})",
              "legendFormat": "{{container}}",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "showPoints": "never",
                "thresholdsStyle": {"mode": "dashed"}
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.6}]
              }
            },
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "id": 10,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14}
        },
        {
          "type": "row",
          "title": "Pods",
          "collapsed": false,
          "panels": [],
          "id": 11,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 22}
        },
        {
          "type": "timeseries",
          "title": "Pods available by Deployment",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"lineclear\"}",
              "legendFormat": "{{deployment}}",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "showPoints": "never"}},
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "id": 12,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 23}
        },
        {
          "type": "timeseries",
          "title": "CPU used by service",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"lineclear\",container!=\"\"}[1m]))",
              "legendFormat": "{{container}}",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "cores", "custom": {"drawStyle": "line", "fillOpacity": 10, "showPoints": "never"}},
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "id": 13,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 23}
        },
        {
          "type": "timeseries",
          "title": "Memory used by service",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"lineclear\",container!=\"\"})",
              "legendFormat": "{{container}}",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "fillOpacity": 10, "showPoints": "never"}},
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "id": 14,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 31}
        },
        {
          "type": "timeseries",
          "title": "Container restarts, last 10 minutes",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"lineclear|monitoring\"}[10m])) > 0",
              "legendFormat": "{{namespace}} {{pod}}",
              "datasource": {"type": "prometheus", "uid": "prometheus"}
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short", "custom": {"drawStyle": "bars", "fillOpacity": 60, "showPoints": "never"}},
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "id": 15,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 31}
        }
      ],
      "templating": {"list": []}
    }
