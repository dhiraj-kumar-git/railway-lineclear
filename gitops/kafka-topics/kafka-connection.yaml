apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-connection
  namespace: lineclear
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: kafka-connection
  dataFrom:
    - extract:
        key: lineclear/kafka/connection