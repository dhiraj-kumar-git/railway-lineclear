# Loki on a fixed port of every node. The internal load balancer that Terraform creates
# (infra/platform/loki_access.tf) forwards logs from outside the cluster here: the Flink
# logs while EMR runs, and the Lambda logs from the log forwarder.
apiVersion: v1
kind: Service
metadata:
  name: loki-node-port
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 31000
