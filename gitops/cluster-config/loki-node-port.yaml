# Loki on a fixed port of every node. While EMR runs, the internal load balancer that
# Terraform creates (infra/platform/loki_access.tf) forwards the Flink logs here.
apiVersion: v1
kind: Service
metadata:
  name: loki-node-port
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 31000
