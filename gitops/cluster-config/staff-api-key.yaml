# The staff API key, generated by Terraform and kept in Secrets Manager.
# Incident Manager and Schedule Manager read it to check the X-Staff-Key header.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staff-api-key
  namespace: lineclear
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: staff-api-key
  dataFrom:
    - extract:
        key: lineclear/staff-api-key
