[project]
name = "incident-manager"
version = "0.1.0"
description = "Incident Manager for Railway LineClear: track incidents, their status history, and their two-phase commit participant"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary,pool]>=3.2",
    "confluent-kafka>=2.6",
    "grpcio>=1.80",
    "grpcio-health-checking>=1.80",
    "grpcio-reflection>=1.80",
    "protobuf>=6.31",
    "prometheus-fastapi-instrumentator>=7.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.80",
]