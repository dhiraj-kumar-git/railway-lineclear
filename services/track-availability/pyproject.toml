[project]
name = "track-availability"
version = "0.1.0"
description = "Track Availability for Railway LineClear: block sections, loop lines and their two-phase commit holds"
requires-python = ">=3.11,<3.12"
dependencies = [
    "grpcio>=1.80",
    "grpcio-health-checking>=1.80",
    "grpcio-reflection>=1.80",
    "protobuf>=6.31",
    "psycopg[binary,pool]>=3.2",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.80",
]