x-database: &database
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: lineclear
  DB_PASSWORD: local-only-password

x-kafka: &kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT

x-schedule-manager: &schedule-manager
  <<: [*database, *kafka]
  DB_NAME: schedule
  LEADER_ELECTION_TARGET: leader-election:50051
  TRACK_AVAILABILITY_TARGET: track-availability:50051
  INCIDENT_MANAGER_TARGET: incident-manager:50051
  TRAIN_REGISTRY_URL: http://train-registry:8000
  STAFF_API_KEY: local-staff-key

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: schedule
      POSTGRES_USER: lineclear
      POSTGRES_PASSWORD: local-only-password
    volumes:
      - ./local-databases.sql:/docker-entrypoint-initdb.d/local-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lineclear -d schedule"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-topics:
    image: apache/kafka:3.9.1
    command:
      - sh
      - -c
      - |
        for topic in incident.events coordination.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  leader-election:
    build: ../leader-election
    restart: on-failure
    environment:
      <<: *kafka
      LEASE_TABLE: lineclear-election-lease
      AWS_REGION: ap-south-1
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "50052:50051"
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      dynamodb:
        condition: service_started

  train-registry:
    build: ../train-registry
    environment:
      <<: *database
      DB_NAME: train_registry
    depends_on:
      postgres:
        condition: service_healthy

  track-availability:
    build: ../track-availability
    environment:
      <<: *database
      DB_NAME: track
      COORDINATOR_TARGET: schedule-manager-a:50051 # asked after a restart about anything in doubt
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  incident-manager:
    build: ../incident-manager
    environment:
      <<: [*database, *kafka]
      DB_NAME: incidents
      COORDINATOR_TARGET: schedule-manager-a:50051 # asked after a restart about anything in doubt
      STAFF_API_KEY: local-staff-key
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully

  schedule-manager-a:
    build: .
    restart: on-failure
    environment:
      <<: *schedule-manager
      CANDIDATE_ID: schedule-manager-a
    ports:
      - "8003:8000"
    depends_on: &schedule-manager-needs
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      leader-election:
        condition: service_started
      track-availability:
        condition: service_started
      incident-manager:
        condition: service_started
      train-registry:
        condition: service_started

  schedule-manager-b:
    build: .
    restart: on-failure
    environment:
      <<: *schedule-manager
      CANDIDATE_ID: schedule-manager-b
    ports:
      - "8004:8000"
    depends_on: *schedule-manager-needs