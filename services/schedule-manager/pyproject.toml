[project]
name = "schedule-manager"
version = "0.1.0"
description = "Schedule Manager for Railway LineClear: the elected two-phase commit coordinator for diversions"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "confluent-kafka>=2.6",
    "grpcio>=1.80",
    "grpcio-health-checking>=1.80",
    "grpcio-reflection>=1.80",
    "protobuf>=6.31",
    "prometheus-fastapi-instrumentator>=7.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.80",
]