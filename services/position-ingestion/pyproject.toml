[project]
name = "position-ingestion"
version = "0.1.0"
description = "Position Ingestion for Railway LineClear: GPS reports to Kafka and DynamoDB"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "confluent-kafka>=2.6",
    "boto3>=1.35",
    "prometheus-fastapi-instrumentator>=7.0",
]